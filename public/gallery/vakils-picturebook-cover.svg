<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-labelledby="title description">
  <title id="title">Nested subquotients</title>
  <desc id="description">A restrained abstract composition of three nested rounded forms in terracotta, violet, and sage.</desc>
  <defs>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="11" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" result="gray-noise" />
      <feComponentTransfer in="gray-noise">
        <feFuncA type="table" tableValues="0 0.035" />
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1000" height="750" fill="#f7f4ec" />

  <g>
    <rect x="200" y="150" width="600" height="450" rx="78" fill="#dfad99" />
    <rect x="260" y="205" width="400" height="370" rx="64" fill="#9692a2" />
    <rect x="325" y="270" width="220" height="250" rx="50" fill="#77877b" />
  </g>

  <rect width="1000" height="750" fill="#6f665d" filter="url(#paper-grain)" opacity="0.28" pointer-events="none" />
</svg>
